[project]
name = "sdg-15"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Om Patil", email = "44ompatil@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "pytest>=7.4.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.12.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "tqdm>=4.65.0",
]

[project.scripts]
sdg-15 = "sdg_15:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sdg_15"
module-root = "SDG"
