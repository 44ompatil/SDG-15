# ML Pipeline Configuration
# Copy this file and rename it for your experiment (e.g., config_cane_toad.yaml).
# Never hard-code these values inside source files.

# -----------------------------------------------------------------
# Dataset
# -----------------------------------------------------------------
dataset:
  # Class names must match the subdirectory names in data/train/, data/validation/, data/test/
  # The first entry is treated as the positive "target" class for binary detection.
  classes:
    - target_species
    - other_animal
    - background

  # Target class name (must be in classes list above)
  target_class: target_species

  # Raw images root – before splitting
  raw_dir: ml/data/raw

  # Split outputs
  train_dir: ml/data/train
  validation_dir: ml/data/validation
  test_dir: ml/data/test

  # Fraction sizes (must sum to 1.0)
  train_split: 0.70
  validation_split: 0.15
  test_split: 0.15

  # Random seed for reproducible splits
  seed: 42

# -----------------------------------------------------------------
# Image preprocessing
# -----------------------------------------------------------------
image:
  width: 224
  height: 224
  # ImageNet mean / std – used when normalizing
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  # Maximum file size in bytes (images above this are rejected)
  max_file_size_bytes: 10485760   # 10 MB

# -----------------------------------------------------------------
# Training
# -----------------------------------------------------------------
training:
  # Supported: mobilenet_v3_small, mobilenet_v3_large, efficientnet_b0, resnet18
  architecture: mobilenet_v3_small
  pretrained: true
  batch_size: 32
  learning_rate: 0.001
  epochs: 20
  # Number of DataLoader workers (set to 0 on Windows if you hit issues)
  num_workers: 0
  # Save checkpoint every N epochs (0 = only save best)
  checkpoint_every: 0
  checkpoint_dir: ml/models/checkpoints
  best_model_path: ml/models/best_model.pt
  seed: 42

# -----------------------------------------------------------------
# Inference
# -----------------------------------------------------------------
inference:
  model_path: ml/models/best_model.pt
  model_version: v1.0
  # Confidence threshold to trigger a "target detected" alert
  confidence_threshold: 0.80
